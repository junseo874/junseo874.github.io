<body>
<header><a href="../bar-playtest/?mode=cutscenes">← 컷씬 목록</a><h1>트레일러 미리보기</h1><span>본편과 분리된 홍보 영상 시퀀스</span><a href="trailer-sources.html">편집 소스</a><a href="index.html">컷씬 편집기</a></header>
<main><section class="viewer">
<div id="stage"><div id="composition">
<iframe id="game" src="../bar-playtest/?dev=1" title="트레일러 전용 게임 화면" tabindex="-1"></iframe>
<video id="footage" playsinline muted preload="auto"></video>
<div id="card"><h2></h2><img alt="프로젝트 루나" src="../bar-playtest/assets/01.ArtResources/05.UI/02.Title/02.Logo/IMG_logo_white.png"></div>
<div id="glitch" aria-hidden="true"></div>
</div><canvas id="serve" width="960" height="540"></canvas><div id="loading" role="status">미리보기 준비 중...</div></div>
<div class="transport"><button id="play" disabled>재생</button><button id="restart" disabled>처음부터</button><output id="clock">00:00 / 00:00</output><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="재생 위치"><button id="fullscreen">전체 화면</button><label>음량 <input id="volume" type="range" min="0" max="1" step=".01" value=".75"></label></div>

</section><aside><h2>장면 바로 보기</h2><nav id="chapters"></nav><p>Space 재생 / 일시정지 · ← → 5초 이동</p></aside></main>
