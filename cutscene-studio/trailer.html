<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUNA · 트레일러 미리보기</title><link rel="stylesheet" href="styles/trailer.css"></head>
<body>
<header><a href="../bar-playtest/?mode=cutscenes">← 컷씬 목록</a><h1>트레일러 미리보기</h1><span>본편과 분리된 홍보 영상 시퀀스</span><a href="index.html">컷씬 편집기</a></header>
<main><section class="viewer">
<div id="stage"><div id="composition">
<iframe id="game" src="../bar-playtest/?dev=1" title="트레일러 전용 게임 화면" tabindex="-1"></iframe>
<video id="footage" playsinline muted preload="auto"></video><canvas id="serve" width="960" height="540"></canvas>
<div id="card"><h2></h2><img alt="프로젝트 루나" src="../bar-playtest/assets/01.ArtResources/05.UI/02.Title/01.Sprites/IMG_logo.png"></div>
<div id="fade"></div><div id="glitch" aria-hidden="true"></div>
</div><div id="loading" role="status">미리보기 준비 중...</div></div>
<div class="transport"><button id="play" disabled>재생</button><button id="restart" disabled>처음부터</button><output id="clock">00:00 / 00:00</output><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="재생 위치"><button id="fullscreen">전체 화면</button><label>음량 <input id="volume" type="range" min="0" max="1" step=".01" value=".55"></label></div>
<p id="status" aria-live="polite">실제 웹 캐릭터·말풍선과 기존 촬영본을 함께 사용합니다. 음악은 넣지 않았습니다.</p>
</section><aside><h2>장면 바로 보기</h2><nav id="chapters"></nav><p>Space 재생 / 일시정지 · ← → 5초 이동<br>제조·거리 걷기·부비·팀 로고는 촬영본이며 나중에 교체할 수 있습니다.</p></aside></main>
<script src="src/trailer-scenes.js"></script><script src="src/trailer-game.js"></script><script src="src/trailer-preview.js"></script>
</body></html>
