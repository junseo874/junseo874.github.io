<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNKNOWN · Cutscene Studio</title>
<link rel="stylesheet" href="styles/studio.css?v=original-font-20261029">
<link rel="stylesheet" href="../bar-playtest/src/shared/dialogue/speech-bubble.css?v=cyan-cursors-20261019">
<link rel="stylesheet" href="../bar-playtest/src/shared/dialogue/dialogue-cue.css?v=1">
<link rel="stylesheet" href="styles/speech-layer.css?v=1">
<script src="../bar-playtest/src/shared/dialogue/dialogue-cue.js?v=1">
</script>
<link rel="stylesheet" href="../bar-playtest/src/shared/ui/cursors.css?v=cyan-cursors-20261019">
<script src="../bar-playtest/src/shared/ui/cursors.js?v=layout-20261019"></script>
</head>
<body>
<header class="topbar">
<a class="brand" href="../">
<b>컷씬 편집기</b>
</a>
<div class="top-spacer">
</div>
<span id="save-state">로컬 자동 저장</span>
<button id="guide">도움말</button>
<button id="import">불러오기</button>
<button id="export" class="primary">JSON 내보내기</button>
<input id="file" type="file" accept="application/json,.json" hidden>
</header>
<nav id="opening-chapters" aria-label="도입부 장면 바로 보기" hidden>
</nav>
<main class="workspace">
<aside class="library">
<div class="panel-heading">
<span>시퀀스</span>
</div>
<label class="field">시퀀스 이름<input id="project-name" maxlength="70">
</label>
<details class="template-fold">
<summary>템플릿</summary>
<div id="templates">
</div>
</details>
<div class="section-label">클립 추가</div>
<div id="palette">
</div>
<details class="scene-hierarchy" open>
<summary>씬 오브젝트</summary>
<div id="scene-objects">
</div>
</details>
<div class="section-label">에셋 <button id="import-asset">가져오기</button>
</div>
<select id="asset-filter" aria-label="에셋 종류">
<option value="all">전체</option>
<option value="sprite">단일 스프라이트</option>
<option value="animation">애니메이션</option>
<option value="object">오브젝트</option>
<option value="effect">이펙트</option>
<option value="audio">사운드</option>
</select>
<div id="asset-list">
</div>
</aside>
<section class="viewer">
<div class="panel-heading">
<div class="scene-tools">
<button id="scene-view" aria-pressed="true">씬뷰</button>
<button data-scene-tool="move" aria-pressed="true" title="이동">이동</button>
<button data-scene-tool="rotate" aria-pressed="false" title="회전">회전</button>
<button data-scene-tool="scale" aria-pressed="false" title="크기">크기</button>
</div>
<div class="viewer-options">
<label>
<input id="guides" type="checkbox" checked> 가이드</label>
<button id="fullscreen" title="씬뷰 전체 화면">⛶</button>
</div>
</div>
<div class="stage-wrap">
<canvas id="stage" width="1280" height="720" aria-label="컷씬 씬뷰. 오브젝트를 선택하고 이동·회전·크기를 조절합니다. 녹화 중에는 현재 시간에 키프레임을 저장합니다.">
</canvas>
<div class="stage-corner">
<span class="live-dot">
</span>
<span id="preview-state">PREVIEW</span>
</div>
<div id="asset-error" hidden>
</div>
<button id="advance" hidden>
<kbd>E</kbd> 다음 대사</button>
</div>
<div class="transport">
<div class="transport-left">
<button id="rewind" title="처음으로 (Home)">|◀</button>
<button id="back-frame" title="이전 프레임 (←)">‹</button>
<button id="play" class="play-button" title="재생 / 일시정지 (Space)">▶</button>
<button id="next-frame" title="다음 프레임 (→)">›</button>
<button id="loop" aria-pressed="false" title="반복 재생">↻</button>
<output id="timecode">00:00.00</output>
<span class="dim">/ <span id="total-time">24.00</span>s</span>
</div>
<div class="transport-right">
<label class="runtime-toggle">
<input id="gates" type="checkbox" checked> 입력 대기 적용</label>
<select id="rate" aria-label="재생 속도">
<option value="0.5">0.5×</option>
<option value="1" selected>1×</option>
<option value="1.5">1.5×</option>
<option value="2">2×</option>
</select>
</div>
</div>
</section>
<aside class="inspector">
<div class="panel-heading">
<span>속성</span>
<span id="clip-type">CLIP</span>
</div>
<div id="inspector-body">
</div>
</aside>
<section class="timeline">
<div id="timeline-resize" role="separator" aria-label="타임라인 높이 조절" title="드래그로 타임라인 높이 조절">
</div>
<div class="timeline-head">
<div>
<b>시퀀스 타임라인</b>
<span id="clip-count" class="dim">
</span>
</div>
<div class="timeline-tools">
<button id="record-scene" aria-pressed="false" title="자동 키 녹화 · 현재 시간의 변경값을 타임라인에 기록">● 녹화</button>
<button id="add-track">＋ 트랙</button>
<label class="duration-label">길이 <input id="project-duration" type="number" min="0.1" max="600" step="1" aria-label="시퀀스 길이"> 초</label>
<button id="undo" title="실행 취소 (⌘/Ctrl Z)">↶</button>
<button id="redo" title="다시 실행 (⌘/Ctrl Shift Z)">↷</button>
<span class="separator">
</span>
<label>
<input id="snap" type="checkbox" checked> <span id="snap-unit">자석 0.25s</span>
</label>
<button id="fit">전체 보기</button>
<label class="zoom-label">−<input id="zoom" type="range" min="24" max="140" value="45" aria-label="타임라인 확대">＋</label>
</div>
</div>
<div class="timeline-viewbar">
<div role="tablist" aria-label="타임라인 편집 모드">
<button role="tab" data-timeline-view="clips" aria-selected="true">클립</button>
<button role="tab" data-timeline-view="keys" aria-selected="false">◆ 키프레임</button>
</div>
<div id="keyframe-actions" hidden>
<output id="key-selection">
</output>
<button id="delete-timeline-key" disabled title="선택한 키만 삭제 (Delete)">키 삭제</button>
</div>
<output id="timeline-frame">
</output>
</div>
<div id="timeline-scroll" tabindex="0" aria-label="타임라인">
<div id="timeline-content">
</div>
</div>
<div class="timeline-foot">
<span id="status-message" role="status">
</span>
<button id="warnings">검사 <span id="warning-count">0</span>
</button>
</div>
</section>
</main>
<script src="src/timeline-groups.js">
</script>
<dialog id="modal">
<header>
<h2 id="modal-title">
</h2>
<button id="close-modal" aria-label="닫기">×</button>
</header>
<div id="modal-body">
</div>
</dialog>
<script src="../bar-playtest/data/runtime/outside-scene-data.js">
</script>
<script src="../bar-playtest/src/features/outside/samho-animation.js?v=samho-idle-20261025"></script>
<script src="../bar-playtest/src/features/outside/home-art.js?v=home-fence-seam-20261020">
</script>
<script src="../bar-playtest/src/cinema/assets.js">
</script>
<script src="../bar-playtest/src/cinema/sprites.js">
</script>
<script src="../bar-playtest/src/cinema/stage.js">
</script>
<script src="../bar-playtest/src/cinema/stage3.js">
</script>
<script src="../bar-playtest/src/cinema/engine.js">
</script>
<script src="src/tags.js">
</script>
<script src="src/media.js?v=main-opening-20261012">
</script>
<script src="src/model.js">
</script>
<script src="src/model-v2.js?v=intro-text-20261016">
</script>
<script src="src/keyframes.js">
</script>
<script src="src/authoring-model.js">
</script>
<script src="src/actor-actions-model.js">
</script>
<script src="src/holo-call.js?v=1">
</script>
<script src="src/opening-template.js?v=home-terrace-sofa-20261019">
</script>
<script src="src/speech-layer.js?v=dressing-audio-20261016">
</script>
<script src="src/typography.js?v=contact-direct-return-20261013">
</script>
<script src="src/extras.js?v=stable-floor-20261020">
</script>
<script src="src/clip-previews.js">
</script>
<script src="src/camera-impulses.js">
</script>
<script src="src/number-scrub.js">
</script>
<script src="src/curve-editor.js">
</script>
<script src="src/keyframe-editor.js">
</script>
<script src="src/scene-recording.js">
</script>
<script src="src/property-controls.js">
</script>
<script src="src/scene-editor.js">
</script>
<script src="src/authoring.js">
</script>
<script src="src/actor-actions-ui.js">
</script>
<script src="src/studio.js?v=original-font-20261029">
</script>
</body>
</html>
