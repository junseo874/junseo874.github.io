<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L.U.N.A // DIRECTION — 한 잔의 선택</title>

<!-- Galmuri11 (official quiple jsdelivr CDN) — 로비(index.html)와 동일 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />

<style>
  :root{
    --bg:#0d1117;
    --bg-deep:#07090d;
    --cyan:#00e5ff;
    --pink:#ff2e88;
    --amber:#ffb400;
    --text:#d8e6ee;
    --dim:#6f8597;
    --panel:rgba(0,229,255,.04);
    --panel-border:rgba(0,229,255,.25);
    --progress-h:44px;
  }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  html,body{height:100%;}
  body{
    background:var(--bg-deep);
    font-family:'Galmuri11',monospace;
    color:var(--text);
    overflow:hidden;
    cursor:crosshair;
    background-image:
      linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,.06) 1px, transparent 1px),
      radial-gradient(ellipse at 20% 0%, rgba(0,229,255,.05), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(255,46,136,.05), transparent 50%);
    background-size:40px 40px, 40px 40px, 100% 100%, 100% 100%;
    background-attachment:fixed;
  }

  /* ═══ CRT 오버레이 스택 — 로비와 동일 ═══ */
  .crt-overlay{
    position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.15) 3px, rgba(0,0,0,.15) 3px);
    mix-blend-mode:multiply;
  }
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:9998;
    background:radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.68) 100%);
  }
  .noise{
    position:fixed;inset:0;pointer-events:none;z-index:9997;opacity:.04;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ═══ HUD 상단바 — 로비와 동일 ═══ */
  .hud-top{
    position:fixed;top:0;left:0;right:0;height:36px;z-index:200;
    background:rgba(7,9,13,.85);
    backdrop-filter:blur(4px);
    border-bottom:1px solid var(--panel-border);
    display:flex;align-items:center;gap:16px;
    padding:0 20px;font-size:11px;color:var(--dim);
    letter-spacing:.08em;
  }
  .hud-top .sys{color:var(--cyan);}
  .hud-top .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 6px var(--cyan);
    animation:hudblink 2s steps(2) infinite;
  }
  @keyframes hudblink{50%{opacity:.25;}}
  .hud-top .spacer{flex:1;}
  .hud-top a.lobby{color:var(--dim);text-decoration:none;transition:color .2s;cursor:pointer;}
  .hud-top a.lobby:hover{color:var(--cyan);}

  /* ═══ 씬 배경 레이어 ═══ */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  #bg .skyline{position:absolute;left:0;right:0;bottom:var(--progress-h);opacity:.55;}
  #bg .rain{
    position:absolute;inset:0;opacity:.35;
    background:repeating-linear-gradient(112deg,
      transparent 0 26px, rgba(0,229,255,.10) 26px 27px, transparent 27px 47px);
    background-size:220px 220px;
    animation:rainfall .8s linear infinite;
  }
  @keyframes rainfall{from{background-position:0 0;}to{background-position:-60px 220px;}}
  #bg .glitch{position:absolute;left:0;right:0;height:2px;opacity:0;}
  #bg .glitch.a{top:26%;background:var(--cyan);animation:glitch 5s steps(2) infinite;}
  #bg .glitch.b{top:63%;background:var(--pink);animation:glitch 7s steps(2) 1.4s infinite;}
  @keyframes glitch{
    0%,92%{opacity:0;transform:none;}
    93%{opacity:.5;transform:translateX(-14px);}
    95%{opacity:.25;transform:translateX(10px);}
    97%,100%{opacity:0;}
  }

  /* ═══ 전체 화면 씬 ═══ */
  #scene{
    position:fixed;left:0;right:0;top:36px;bottom:var(--progress-h);
    overflow-y:auto;overflow-x:hidden;
    display:flex;z-index:1;
  }
  #scene::-webkit-scrollbar{width:8px;}
  #scene::-webkit-scrollbar-track{background:transparent;}
  #scene::-webkit-scrollbar-thumb{background:rgba(0,229,255,.25);}
  #scene::-webkit-scrollbar-thumb:hover{background:rgba(0,229,255,.45);}

  .slide{
    margin:auto;
    width:100%;
    max-width:860px;
    padding:40px 28px;
    text-align:center;
    display:flex;flex-direction:column;align-items:center;
    position:relative;
    animation:decode .55s steps(10) both;   /* CRT 디코드: 전체가 한 번에 구현됨 */
  }
  .slide.wide{max-width:1080px;}
  /* 씬 등장: 스캔라인이 쓸고 지나가며 화면이 "구현"되는 효과 */
  @keyframes decode{
    0%  {opacity:0;clip-path:inset(0 0 100% 0);}
    8%  {opacity:1;}
    62% {clip-path:inset(0 0 0% 0);transform:none;}
    70% {transform:translateX(-3px) skewX(.6deg);}
    78% {transform:translateX(2px) skewX(-.4deg);}
    86% {transform:none;}
    100%{clip-path:inset(0 0 0 0);transform:none;}
  }
  .slide::after{               /* 지나가는 스캔 바 */
    content:"";position:absolute;left:-4%;right:-4%;top:0;height:3px;
    background:var(--cyan);
    box-shadow:0 0 14px rgba(0,229,255,.9), 0 0 34px rgba(0,229,255,.4);
    animation:scanbar .55s steps(10) both;
    pointer-events:none;
  }
  @keyframes scanbar{
    0%  {top:0;opacity:.9;}
    62% {top:100%;opacity:.9;}
    63% {opacity:0;}
    100%{top:100%;opacity:0;}
  }
  @keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  /* ═══ 부트(로딩) 스크린 — 바 오픈 준비 ═══ */
  #boot{
    position:fixed;inset:0;z-index:10000;
    background:var(--bg-deep);
    overflow:hidden;
    transition:opacity .45s steps(6);
  }
  #boot.open{opacity:0;pointer-events:none;}
  #boot .boot-inner{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;
  }
  #boot .boot-title{font-size:22px;letter-spacing:5px;color:var(--dim);}
  #boot .boot-title b{color:var(--cyan);font-weight:normal;}
  #boot .boot-pct{font-size:44px;color:var(--text);}
  #boot .boot-pct .pctsign{font-size:24px;color:var(--dim);}
  #boot .boot-bar{
    width:min(420px, 70vw);height:14px;
    border:2px solid var(--panel-border);
    background:rgba(0,229,255,.04);
    position:relative;image-rendering:pixelated;
  }
  #boot .boot-bar .fill{
    position:absolute;left:2px;top:2px;bottom:2px;width:0%;
    background:var(--cyan);
    box-shadow:0 0 10px rgba(0,229,255,.7);
  }
  #boot .boot-log{font-size:17px;color:var(--dim);min-height:24px;animation:blink 1.2s steps(2) infinite;}
  #boot .boot-glass{margin-bottom:4px;}

  h1{font-size:46px;line-height:1.5;margin-bottom:14px;font-weight:normal;}
  h1 .cy{color:var(--cyan);}
  h2{font-size:30px;line-height:1.55;margin-bottom:10px;font-weight:normal;}
  h2.glitch-text{text-shadow:2px 0 rgba(255,46,136,.55), -2px 0 rgba(0,229,255,.55);}
  p.narr{font-size:22px;line-height:1.75;margin-bottom:12px;max-width:760px;}
  p.narr .cy{color:var(--cyan);}
  p.narr .pk{color:var(--pink);}
  p.narr .am{color:var(--amber);}
  p.sub{font-size:18px;color:var(--dim);line-height:1.7;margin-bottom:8px;}

  /* ═══ 캐릭터 + 말풍선 ═══ */
  .speaker{
    display:flex;align-items:center;justify-content:center;
    gap:6px;margin:4px 0 14px;
  }
  .speaker svg{flex:none;image-rendering:pixelated;}
  .speech{
    position:relative;
    border:2px solid var(--panel-border);
    background:var(--panel);
    padding:16px 22px;
    font-size:23px;line-height:1.8;
    max-width:460px;text-align:left;
  }
  .speech::before{
    content:"";position:absolute;left:-12px;bottom:26px;
    width:0;height:0;
    border-top:9px solid transparent;
    border-bottom:9px solid transparent;
    border-right:12px solid var(--panel-border);
  }
  .speech::after{
    content:"";position:absolute;left:-9px;bottom:28px;
    width:0;height:0;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
    border-right:10px solid #0e1720;
  }
  .speech .who{display:block;font-size:15px;letter-spacing:2px;color:var(--cyan);margin-bottom:8px;}
  .speech .who::before{content:"▌ ";}
  .speaker.rev{flex-direction:row-reverse;}
  .speaker.rev .speech::before{left:auto;right:-12px;border-right:none;
    border-left:12px solid var(--panel-border);}
  .speaker.rev .speech::after{left:auto;right:-9px;border-right:none;
    border-left:10px solid #0e1720;}
  .speaker.drunk.rev .speech::before{border-left-color:rgba(255,46,136,.5);}
  .speaker.drunk.rev .speech::after{border-left-color:#170d14;}
  .speaker.drunk .speech{border-color:rgba(255,46,136,.5);background:rgba(255,46,136,.05);}
  .speaker.drunk .speech::before{border-right-color:rgba(255,46,136,.5);}
  .speaker.drunk .speech::after{border-right-color:#170d14;}
  .speaker.drunk .speech .who{color:var(--pink);}

  /* ═══ 픽셀 버튼 ═══ */
  .btn{
    font-family:inherit;font-size:23px;color:var(--bg-deep);
    background:var(--cyan);
    border:none;padding:13px 30px;cursor:pointer;
    box-shadow:4px 4px 0 rgba(0,229,255,.25);
    letter-spacing:1px;
    transition:transform .05s;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(0,229,255,.3);}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,229,255,.25);}
  .btn.ghost{background:transparent;color:var(--cyan);border:2px solid var(--cyan);box-shadow:4px 4px 0 rgba(0,229,255,.15);}
  .btn.pink{background:var(--pink);box-shadow:4px 4px 0 rgba(255,46,136,.25);}
  .btn.small{font-size:17px;padding:7px 14px;box-shadow:2px 2px 0 rgba(0,229,255,.2);}
  .actions{margin-top:18px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}

  /* 선택지 (텍스트형) */
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:4px;width:100%;max-width:560px;}
  .choices button{
    font-family:inherit;font-size:21px;text-align:left;
    color:var(--text);background:var(--panel);
    border:1px solid var(--panel-border);
    padding:12px 16px;cursor:pointer;line-height:1.6;
  }
  .choices button:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.08);}
  .choices button:disabled{opacity:.35;cursor:default;}
  .choices button .no{color:var(--amber);margin-right:10px;}

  /* 잔 선택 (5지선다) */
  .glass-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:24px;}
  .glass-btn{
    font-family:inherit;color:var(--text);font-size:18px;
    background:var(--panel);border:1px solid var(--panel-border);
    width:136px;padding:16px 8px 12px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:transform .08s;
  }
  .glass-btn:hover:not(:disabled){border-color:var(--cyan);transform:translateY(-4px);}
  .glass-btn:disabled{opacity:.3;cursor:default;}
  .glass-btn svg{image-rendering:pixelated;}
  .glass-btn .gname{line-height:1.4;}

  .result{
    border-left:3px solid var(--cyan);
    background:rgba(0,229,255,.06);
    padding:14px 20px;margin:12px auto 0;
    font-size:21px;line-height:1.8;max-width:640px;
    text-align:left;
    animation:fadein .3s steps(4) both;
  }
  .result.bad{border-color:var(--pink);background:rgba(255,46,136,.06);}
  .result.good{border-color:var(--amber);background:rgba(255,180,0,.07);}

  /* 당신의 밤 (리캡) */
  .recap{
    border:1px solid var(--panel-border);background:var(--panel);
    padding:14px 24px;margin:4px auto 14px;
    max-width:560px;width:100%;text-align:left;
    font-size:20px;line-height:1.85;
  }
  .recap .rc-title{font-size:16px;letter-spacing:3px;color:var(--dim);margin-bottom:10px;}
  .recap .row{display:flex;justify-content:space-between;gap:18px;}
  .recap .row .k{color:var(--dim);flex:none;}
  .recap .row .v{text-align:right;}
  .recap .v.cy{color:var(--cyan);} .recap .v.pk{color:var(--pink);} .recap .v.am{color:var(--amber);}

  /* ═══ 하단 진행 바: 잔 아이콘 ═══ */
  #progress{
    position:fixed;left:0;right:0;bottom:0;height:var(--progress-h);
    border-top:1px solid var(--panel-border);
    display:flex;align-items:center;justify-content:center;gap:18px;
    background:var(--bg-deep);
    z-index:30;
  }
  #progress .tick{
    width:22px;height:26px;flex:none;cursor:pointer;
    color:rgba(216,230,238,.16);
    transition:color .2s, transform .1s;
    position:relative;
  }
  #progress .tick svg{display:block;}
  #progress .tick:hover{color:rgba(0,229,255,.65);transform:translateY(-2px);}
  #progress .tick.past{color:rgba(0,229,255,.38);}
  #progress .tick.on{color:var(--cyan);filter:drop-shadow(0 0 6px rgba(0,229,255,.9));}

  /* 음소거 버튼 */
  /* HUD 내 사운드 토글 — 로비 #sndBtn과 동일 톤 */
  #mute{
    font-family:inherit;font-size:11px;letter-spacing:.08em;
    background:none;border:none;cursor:pointer;
    color:var(--amber);text-shadow:0 0 8px rgba(255,180,0,.5);
    transition:color .2s;
  }
  #mute.off{color:var(--dim);text-shadow:none;}
  #mute:hover{color:var(--amber);}

  /* ═══════════ 미니게임 ═══════════ */
  #mg{width:100%;display:flex;flex-direction:column;align-items:center;text-align:left;}
  #tut{
    width:100%;max-width:900px;
    border:1px solid rgba(255,180,0,.5);
    background:rgba(255,180,0,.07);
    color:var(--amber);
    font-size:18px;line-height:1.6;
    padding:9px 13px;margin-bottom:16px;
    display:flex;gap:10px;align-items:center;
  }
  #tut::before{content:"TIP";flex:none;font-size:13px;border:1px solid var(--amber);padding:2px 6px;letter-spacing:2px;}

  .mg-body{width:100%;max-width:900px;display:flex;gap:26px;min-height:420px;}
  .mg-left{width:230px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .order-card{
    width:100%;border:1px solid var(--panel-border);background:var(--panel);
    padding:10px 12px;font-size:17px;color:var(--dim);line-height:1.6;
  }
  .order-card b{color:var(--cyan);font-weight:normal;font-size:21px;display:block;}
  #glass-holder{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;}
  .oz-read{font-size:17px;color:var(--dim);}
  .oz-read b{color:var(--amber);font-weight:normal;}

  .mg-right{flex:1;display:flex;flex-direction:column;min-height:0;}
  .shelf-tabs{display:flex;gap:6px;margin-bottom:10px;}
  .shelf-tabs button{
    font-family:inherit;font-size:17px;
    background:transparent;color:var(--dim);
    border:1px solid var(--panel-border);
    padding:7px 13px;cursor:pointer;letter-spacing:1px;
  }
  .shelf-tabs button.on{color:var(--bg-deep);background:var(--cyan);border-color:var(--cyan);}
  .shelf{
    flex:1;border:1px solid var(--panel-border);background:rgba(7,9,13,.5);
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    padding:14px;align-content:start;overflow:auto;
  }
  .shelf-item{
    font-family:inherit;font-size:17px;color:var(--text);
    background:var(--panel);border:1px solid var(--panel-border);
    padding:12px 6px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .shelf-item:hover{border-color:var(--cyan);}
  .shelf-item.used{opacity:.3;pointer-events:none;}
  .shelf-item.wrong{animation:shake .3s steps(4);border-color:var(--pink);}
  @keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .shelf-item svg{width:34px;height:52px;}

  .mg-steps{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap;}
  .mg-steps .st{
    font-size:16px;padding:5px 9px;
    border:1px solid var(--panel-border);color:var(--dim);
    background:var(--panel);
  }
  .mg-steps .st.done{color:var(--bg-deep);background:var(--cyan);border-color:var(--cyan);}
  .mg-steps .st.now{color:var(--amber);border-color:var(--amber);}

  /* ═══ 김믹 오버레이 ═══ */
  #gimmick{
    position:fixed;left:0;right:0;top:0;bottom:var(--progress-h);
    z-index:20;
    background:rgba(7,9,13,.94);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;cursor:pointer;
  }
  #gimmick.perfect::after{
    content:"";position:absolute;inset:0;background:rgba(255,255,255,.16);
    animation:flash .4s steps(3) forwards;pointer-events:none;
  }
  @keyframes flash{from{opacity:1;}to{opacity:0;}}
  #gimmick .g-name{font-size:28px;color:var(--cyan);letter-spacing:2px;}
  #gimmick .g-hud{
    display:flex;align-items:center;gap:22px;
    font-size:20px;color:var(--dim);
    border:1px solid var(--panel-border);
    background:var(--panel);
    padding:8px 18px;
  }
  #gimmick .g-hud .tag{font-size:14px;letter-spacing:2px;color:var(--dim);opacity:.8;}
  #gimmick .g-hud .tgt{color:var(--amber);}
  #gimmick .g-hint{font-size:19px;color:var(--dim);animation:blink 1.4s steps(2) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #gimmick .g-grade{font-size:36px;letter-spacing:4px;animation:pop .3s steps(4) both;}
  @keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  .g-stage{display:flex;align-items:flex-end;gap:44px;}
  #g-bottle{transition:transform .2s steps(4);transform-origin:bottom right;}
  #g-bottle.pouring{transform:rotate(-52deg) translate(6px,-8px);}
  #g-glasswrap{position:relative;}
  #g-stream{
    position:absolute;top:8px;left:50%;margin-left:-16px;
    width:6px;height:0;opacity:.9;image-rendering:pixelated;
  }
  .spark{
    position:absolute;color:var(--cyan);font-size:24px;
    animation:sparkpop .5s steps(5) both;pointer-events:none;
  }
  @keyframes sparkpop{
    0%{transform:scale(.3);opacity:0;}
    40%{transform:scale(1.15);opacity:1;}
    100%{transform:scale(.9) translateY(-8px);opacity:0;}
  }
</style>
</head>
<body>

<!-- CRT stack — 로비와 동일 -->
<div class="crt-overlay"></div>
<div class="vignette"></div>
<div class="noise"></div>

<!-- HUD — 로비와 동일 -->
<header class="hud-top">
  <span class="dot"></span>
  <span class="sys">L.U.N.A_OS</span>
  <span>//</span>
  <span>DIRECTION</span>
  <span>—</span>
  <span>한 잔의 선택</span>
  <span class="spacer"></span>
  <span id="hudClock">--:--:--</span>
  <button id="mute" type="button" onclick="SND.toggle(this)" title="소리 켜기/끄기">[♪ SOUND ON]</button>
  <a class="lobby" href="index.html">[⟵ LOBBY]</a>
</header>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-glass" id="boot-glass"></div>
    <div class="boot-title">BAR <b>언노운</b> — 오픈 준비 중</div>
    <div class="boot-pct"><span id="boot-num">0</span><span class="pctsign"> %</span></div>
    <div class="boot-bar"><div class="fill" id="boot-fill"></div></div>

/* ══════════ 8bit 사운드 ══════════ */
const SND = {
  ctx:null, muted:false, _pour:null,
  ensure(){
    if(!this.ctx){
      try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx;
  },
  beep(freq, dur=0.06, type='square', vol=0.06, delay=0){
    if(this.muted) return;
    const ctx = this.ensure(); if(!ctx) return;
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  click(){ this.beep(700, .04, 'square', .045); },
  tap(){ this.beep(460, .05, 'square', .05); },
  bell(){ this.beep(988, .09, 'square', .05); this.beep(1319, .14, 'square', .05, .09); },
  good(){ [523,659,784].forEach((f,i)=>this.beep(f, .09, 'square', .055, i*.08)); },
  serve(){ [523,659,784,1046].forEach((f,i)=>this.beep(f, .1, 'square', .055, i*.09)); },
  bad(){ this.beep(220, .18, 'sawtooth', .05); this.beep(160, .22, 'sawtooth', .05, .12); },
  pourStart(){
    if(this._pour) return;
    const ctx = this.ensure(); if(!ctx) return;
    const len = ctx.sampleRate;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 850; bp.Q.value = 0.9;
    const g = ctx.createGain(); g.gain.value = this.muted ? 0 : 0.05;
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start();
    this._pour = {src, g};
  },
  pourStop(){
    if(this._pour){ try{this._pour.src.stop();}catch(e){} this._pour=null; }
  },
  toggle(btn){
    this.muted = !this.muted;
    if(this._pour) this._pour.g.gain.value = this.muted ? 0 : 0.05;
    btn.textContent = this.muted ? '[♪ SOUND OFF]' : '[♪ SOUND ON]';
    btn.classList.toggle('off', this.muted);
  },
};

              const label = s.type==='pour' ? `${s.label} ${s.target}oz`
                          : s.type==='garnish' ? `${s.label}` : (s.chip || '젓기');
              return `<div class="st ${cls}">${i+1}. ${label}</div>`;
            }).join('')}
            ${doneAll ? `<button class="btn pink" style="margin-left:auto;" onclick="finishMG()">🍸 서빙</button>` : ''}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

window.setTab = function(id){ state.mg.tab = id; renderMG(); };
window.toggleRecipe = function(){
  const el = document.getElementById('recipe-note');
  el.style.display = el.style.display==='none' ? 'block' : 'none';
};

function shelfItemsHTML(){
  const tab = SHELF_TABS.find(t=>t.id===state.mg.tab);
  const usedIds = RECIPE.steps.slice(0, state.mg.stepIdx).map(s=>s.id);
  return tab.items.map(it=>{
    const icon = it.kind==='fruit'  ? fruitSVG(it.color)
               : it.kind==='shaker' ? shakerSVG()
               : it.kind==='tool'   ? toolSVG()
               : bottleSVG(it.color);
    const used = usedIds.includes(it.id);
    return `<button class="shelf-item ${used?'used':''}" data-id="${it.id}" onclick="pickItem('${it.id}', this)">
      ${icon}<span>${it.label}</span>
    </button>`;
  }).join('');
}

window.pickItem = function(id, el){
  const st = curStep();
  if(!st) return;
  if(id !== st.id){
    el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
    SND.bad();
    document.getElementById('tut').innerHTML =
      `<span style="color:var(--pink)">그 재료가 아니에요!</span>&nbsp; 레시피 노트를 확인해보세요 — 지금 필요한 건 <b style="color:#fff">${st.label}</b>.`;
    return;
  }
  if(st.type==='pour')    openPour(st);
  if(st.type==='garnish') openGarnish(st);
  if(st.type==='stir')    openStir(st);
};

/* ─── 김믹 공통 ─── */
let gimmickEl = null, gimmickTimer = null;
function clearGimmick(){
  if(gimmickTimer){ cancelAnimationFrame(gimmickTimer); gimmickTimer=null; }
  if(gimmickEl){ gimmickEl.remove(); gimmickEl=null; }
}
function openGimmick(html){
  clearGimmick();
  gimmickEl = document.createElement('div');
  gimmickEl.id = 'gimmick';
  gimmickEl.innerHTML = html;
  document.body.appendChild(gimmickEl);
  return gimmickEl;
}
function stepDone(score){
  state.mg.scores.push(score);
  state.mg.stepIdx++;
  setTimeout(()=>{ clearGimmick(); renderMG(); }, 900);
}
function gradeOf(score){
  return score>=90 ? ['PERFECT','var(--cyan)'] : score>=65 ? ['GOOD','var(--amber)'] : ['BAD…','var(--pink)'];
}
function showGrade(score, extra=''){
  const [g,c] = gradeOf(score);
  const hint = gimmickEl.querySelector('.g-hint');
  if(hint) hint.remove();
  gimmickEl.insertAdjacentHTML('beforeend',
    `<div class="g-grade" style="color:${c}">${g}</div><div style="color:var(--dim);font-size:17px;">${extra}</div>`);
  if(score>=90){
    SND.good();
    gimmickEl.classList.add('perfect');
    const wrap = gimmickEl.querySelector('#g-glasswrap') || gimmickEl.querySelector('.g-stage');
    if(wrap){
      wrap.insertAdjacentHTML('beforeend',
        `<span class="spark" style="top:-14px;left:-10px;">✦</span>
         <span class="spark" style="top:8px;right:-16px;animation-delay:.12s;">✦</span>
         <span class="spark" style="bottom:30px;left:-18px;animation-delay:.22s;">✦</span>`);
    }
  }else if(score>=65){ SND.good(); }
  else{ SND.bad(); }
}

/* ─── 따르기: 탭 시작 → 탭 멈춤 ─── */
function openPour(st){
  let poured = 0, pouring = false, ended = false, last = 0;
  const rate = Math.max(0.6, Math.min(1.4, st.target * 0.55)); // 목표량이 적으면 천천히
  const item = SHELF_TABS.flatMap(t=>t.items).find(i=>i.id===st.id);
  const el = openGimmick(`
    <div class="g-name">${st.label}</div>
    <div class="g-stage">
      <div id="g-bottle">${bottleSVG(item.color, 66, 104)}</div>
      <div id="g-glasswrap">
        <div id="g-glass">${highballSVG([...state.mg.layers, {oz:0, color:st.color}], RECIPE.glassMax, 118, 182)}</div>
        <div id="g-stream" style="background:${st.color};"></div>
      </div>
    </div>
    <div class="g-hud">
      <span class="tag">POUR</span>
      <span id="g-oz">0.00 / <span class="tgt">${st.target.toFixed(2)} oz</span></span>
    </div>
    <div class="g-hint">화면을 탭하면 따르기 시작 · 다시 탭하면 멈춤</div>
  `);

  function frame(now){
    if(ended) return;
    if(pouring){
      poured += ((now - last)/1000) * rate;
      const diff = Math.abs(poured - st.target);
      const col = diff<=0.12 ? 'var(--cyan)' : diff<=0.3 ? 'var(--amber)' :
                  poured > st.target ? 'var(--pink)' : 'var(--text)';
      document.getElementById('g-oz').innerHTML =
        `<b style="color:${col}">${poured.toFixed(2)}</b> / <span class="tgt">${st.target.toFixed(2)} oz</span>`;
      document.getElementById('g-glass').innerHTML =
        highballSVG([...state.mg.layers, {oz:poured, color:st.color}], RECIPE.glassMax, 118, 182);
      if(poured >= RECIPE.glassMax - totalOz()){ stop(); return; }
    }
    last = now;
    gimmickTimer = requestAnimationFrame(frame);
  }
  function stop(){
    ended = true; pouring = false;
    SND.pourStop();
    document.getElementById('g-bottle').classList.remove('pouring');
    document.getElementById('g-stream').style.height = '0px';
    const diff = Math.abs(poured - st.target);
    const score = diff<=0.12 ? 100 : diff<=0.3 ? 75 : diff<=0.6 ? 50 : 25;
    showGrade(score, `목표 ${st.target}oz · 실제 ${poured.toFixed(2)}oz (오차 ${diff.toFixed(2)})`);
    state.mg.layers.push({oz:poured, color:st.color});
    stepDone(score);
  }
  el.addEventListener('click', ()=>{
    if(ended) return;
    if(!pouring){
      pouring = true; last = performance.now();
      SND.pourStart();
      document.getElementById('g-bottle').classList.add('pouring');
      document.getElementById('g-stream').style.height = '56px';
      el.querySelector('.g-hint').textContent = '탭하여 멈추기!';
      gimmickTimer = requestAnimationFrame(frame);
    }else{
      stop();
    }
  });
}

/* ─── 젓기: 연타 ─── */
function openStir(st){
  let n = 0, ended = false;
  const el = openGimmick(`
    <div class="g-name">${st.title || '잘 저어주세요'}</div>
    <div class="g-stage">
      <div id="g-glasswrap">
        <div id="g-glass" style="transition:transform .1s;">${highballSVG(state.mg.layers, RECIPE.glassMax, 134, 206)}</div>
      </div>
    </div>
    <div class="g-hud">
      <span class="tag">STIR</span>
      <span id="g-cnt">0 / ${st.count}</span>
    </div>
    <div class="g-hint">${st.hint || '잔을 탭해서 젓기!'} (${st.count}회)</div>
  `);
  el.addEventListener('click', ()=>{
    if(ended) return;
    n++; SND.tap();
    document.getElementById('g-cnt').textContent = `${n} / ${st.count}`;
    const g = document.getElementById('g-glass');
    g.style.transform = `rotate(${n%2? -6 : 6}deg)`;
    setTimeout(()=>g.style.transform='', 90);
    if(n >= st.count){
      ended = true;
      state.mg.layers = [{oz: totalOz(), color: st.mixColor || '#dde8ec'}];
      showGrade(100, st.done || '재료가 고르게 섞였습니다.');
      stepDone(100);
    }
  });
}

/* ─── 가니시: 연타로 올리기 ─── */
function openGarnish(st){
  let n = 0, ended = false;
  const item = SHELF_TABS.flatMap(t=>t.items).find(i=>i.id===st.id);
  const el = openGimmick(`
    <div class="g-name">${st.title || (st.label + ' 올리기')}</div>
    <div class="g-stage">
      <div id="g-fruit">${fruitSVG(item.color, 84, 130)}</div>
      <div id="g-glasswrap">
        <div id="g-glass">${highballSVG(state.mg.layers, RECIPE.glassMax, 118, 182)}</div>
      </div>
    </div>
    <div class="g-hud">
      <span class="tag">GARNISH</span>
      <span id="g-cnt">0 / ${st.count}</span>
    </div>
    <div class="g-hint">${st.hint || '탭해서 잔에 올리기!'} (${st.count}회)</div>
  `);
  el.addEventListener('click', ()=>{
    if(ended) return;
    n++; SND.tap();
    document.getElementById('g-cnt').textContent = `${n} / ${st.count}`;
    const f = document.getElementById('g-fruit');
    f.style.transform = 'scale(.85)'; setTimeout(()=>f.style.transform='', 90);
    if(n >= st.count){
      ended = true;
      if(st.addOz) state.mg.layers.push({oz:st.addOz, color:st.addColor || '#f6e7a6'});
      showGrade(100, st.done || `${st.label}가 잔에 자리를 잡았습니다.`);
      stepDone(100);
    }
  });
}

/* ─── 완성 ─── */
window.finishMG = function(){
  const sc = state.mg.scores;
  state.mgScore = Math.round(sc.reduce((a,b)=>a+b,0) / sc.length);
  SND.serve();
  go(3);
};

/* ══════════ 부트 시퀀스: 카운터 0→100% → 문이 열리며 바 오픈 ══════════ */
function bootGlassSVG(pct){
  const H = 34;                       // 마티니 잔 볼 채움 높이
  const fillH = Math.round(H * pct / 100);
  const y = 12 + (H - fillH);
  return `
  <svg width="72" height="86" viewBox="0 0 72 86" style="image-rendering:pixelated">
    <defs><clipPath id="bowl">
      <polygon points="8,12 64,12 36,46"/>
    </clipPath></defs>
    <rect x="8" y="${y}" width="56" height="${fillH}" fill="rgba(0,229,255,.75)" clip-path="url(#bowl)"/>
    <polygon points="6,10 66,10 36,48" fill="none" stroke="#d8e6ee" stroke-width="3"/>
    <rect x="34" y="46" width="4" height="24" fill="#d8e6ee"/>
    <rect x="22" y="72" width="28" height="4" fill="#d8e6ee"/>
  </svg>`;
}
const BOOT_LOGS = [
  [0,  '시스템 점검 중…'],
  [22, '잔 데이터 불러오는 중…'],
  [45, '레시피 동기화 중…'],
  [68, '카운터 닦는 중…'],
  [90, '문 열 준비 완료.'],
];
(function boot(){
  const bootEl = document.getElementById('boot');
  const numEl  = document.getElementById('boot-num');
  const fillEl = document.getElementById('boot-fill');
  const logEl  = document.getElementById('boot-log');
  const glassEl= document.getElementById('boot-glass');
  let pct = 0, fontReady = false, t0 = performance.now();
  try{ document.fonts.ready.then(()=>{ fontReady = true; }); }
  catch(e){ fontReady = true; }
  setTimeout(()=>{ fontReady = true; }, 2500);          // 폰트가 늦어도 최대 2.5초
  // RAF 대신 setInterval — 백그라운드 탭에서 RAF가 멈춰 부트가 끝나지 않는 문제 방지
  let last = performance.now();
  const timer = setInterval(()=>{
    const now = performance.now();
    const dt = Math.min((now - last) / 16.7, 4);         // 프레임 배수(스로틀 시 따라잡기)
    last = now;
    const target = fontReady ? 100 : 88;                 // 폰트 로드 전엔 88%에서 대기
    const speed  = (0.9 + (target - pct) * 0.035) * dt;
    pct = Math.min(target, pct + speed);
    const shown = Math.floor(pct);
    numEl.textContent = shown;
    fillEl.style.width = pct + '%';
    glassEl.innerHTML = bootGlassSVG(pct);
    for(const [th, msg] of BOOT_LOGS){ if(shown >= th) logEl.textContent = msg; }
    if(pct >= 100 && now - t0 > 1200){
      clearInterval(timer);
      bootEl.classList.add('open');                      // 부트 화면 페이드아웃
      go(0);                                             // 표지가 디코드되며 등장
      setTimeout(()=>bootEl.remove(), 500);
    }
  }, 30);
  glassEl.innerHTML = bootGlassSVG(0);
})();

/* 시작(부트가 문을 열면서 go(0) 호출) */
</script>

<!-- HUD clock -->
<script>
(function(){
  const el = document.getElementById('hudClock');
  function tick(){
    const d = new Date(), p = n => String(n).padStart(2,'0');
    el.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);
})();
</script>
